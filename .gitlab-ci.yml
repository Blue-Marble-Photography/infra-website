# Included from the root .gitlab-ci.yml; paths are relative to the repo root.

# AWS credentials via GitLab OIDC (role in infra/iam.tf, trusted for main only).
.infra_aws_oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    AWS_ROLE_ARN: arn:aws:iam::530167849052:role/gitlab-ci-bluemarble.photography
    AWS_ROLE_SESSION_NAME: gitlab-$CI_PROJECT_NAME-$CI_JOB_ID
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/gitlab-oidc-token
  before_script:
    - printf '%s' "$GITLAB_OIDC_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"

deploy-resize-lambda:
  stage: deploy
  extends: .infra_aws_oidc
  image: public.ecr.aws/sam/build-python3.14:1.169.0-20261014205103
  tags:
    - saas-linux-small-arm64
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - changes:
        - infra/lambdas/resize-images/**/*
  script:
    - cd infra/lambdas/resize-images
    - sam build
    - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
